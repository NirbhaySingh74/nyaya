# Pushes backend/ to the Hugging Face Space, which rebuilds the Docker image.
# Needs repo secret HF_TOKEN (a Hugging Face token with write access).
name: Deploy API to Hugging Face

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-space.yml"]
  workflow_dispatch:

env:
  HF_SPACE: nirbhay1234/nyaya-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push backend/ subtree to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git subtree split --prefix backend -b space
          git push --force "https://nirbhay1234:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space:main
